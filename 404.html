<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found | Stackly Volunteer Organization</title>

  <meta
    name="description"
    content="The page you're looking for doesn't exist — but there's always another way to make an impact with Stackly."
  >

  <meta name="robots" content="noindex">

  <link
    rel="icon"
    href="assets/svg/stackly-symbol-lime.svg"
    type="image/svg+xml"
  >

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap"
    rel="stylesheet"
  >

  <!-- Website CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">


  <!-- =====================================================
       404 PAGE FIX
       ===================================================== -->
  <style>

    /* =====================================================
       GLOBAL RESET
       ===================================================== */

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      overflow: hidden !important;

      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
    }


    body {
      position: fixed;
      inset: 0;

      overflow: hidden !important;
    }


    /* =====================================================
       MAIN 404 SCREEN
       ===================================================== */

    .err-page {
      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;
      height: 100svh;

      overflow: hidden !important;

      display: flex;
      flex-direction: column;

      isolation: isolate;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .err-header {
      position: relative;

      z-index: 20;

      flex: 0 0 auto;

      width: 100%;
    }


    /* =====================================================
       DECORATIVE SHAPES
       ===================================================== */

    .err-shapes {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden !important;

      pointer-events: none;

      z-index: 1;
    }


    .err-shapes svg {
      position: absolute;

      pointer-events: none;

      max-width: 120px;
    }


    /* =====================================================
       CENTER AREA
       ===================================================== */

    .err-center {

      position: relative;

      z-index: 10;

      flex: 1;

      width: min(900px, 92vw);

      margin: 0 auto;

      padding: 20px 20px 30px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      min-height: 0;

      overflow: hidden;
    }


    /* =====================================================
       404 NUMBER
       ===================================================== */

    .err-code {

      line-height: 0.85;

      margin: 0 0 22px;

      font-size: clamp(90px, 15vw, 190px);

      font-weight: 800;

      letter-spacing: -8px;

      white-space: nowrap;
    }


    .err-code b {
      color: #c9f45a;
    }


    /* =====================================================
       HEADING
       ===================================================== */

    .err-center h1 {

      margin: 0;

      max-width: 760px;

      font-size: clamp(28px, 4vw, 52px);

      line-height: 1.12;

      letter-spacing: -1.5px;

      overflow-wrap: break-word;
    }


    .err-center h1 em {
      display: inline-block;
    }


    /* =====================================================
       DESCRIPTION
       ===================================================== */

    .err-center p {

      max-width: 580px;

      margin: 18px auto 0;

      font-size: 13px;

      line-height: 1.7;

      color: rgba(255,255,255,0.65);

      overflow-wrap: break-word;
    }


    /* =====================================================
       BUTTON AREA
       ===================================================== */

    .err-actions {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 12px;

      margin-top: 25px;

      flex-wrap: wrap;

      width: 100%;
    }


    .err-actions .btn {
      flex: 0 0 auto;
    }


    /* =====================================================
       DESKTOP HEIGHT FIX
       ===================================================== */

    @media (min-width: 769px) {

      .err-center {
        padding-top: 10px;
        padding-bottom: 30px;
      }

      .err-code {
        font-size: clamp(100px, 13vw, 180px);
        margin-bottom: 18px;
      }

      .err-center h1 {
        font-size: clamp(30px, 3.5vw, 50px);
      }

      .err-center p {
        margin-top: 14px;
      }

      .err-actions {
        margin-top: 20px;
      }
    }


    /* =====================================================
       TABLET
       ===================================================== */

    @media (max-width: 900px) {

      .err-center {
        width: 94vw;

        padding: 15px 18px 25px;
      }

      .err-code {
        font-size: clamp(85px, 17vw, 145px);

        letter-spacing: -6px;

        margin-bottom: 18px;
      }

      .err-center h1 {
        font-size: clamp(27px, 5vw, 42px);
      }

      .err-center p {
        max-width: 500px;

        font-size: 12px;

        margin-top: 14px;
      }

      .err-actions {
        margin-top: 20px;
      }
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 600px) {

      .err-page {
        min-height: 100svh;
      }


      .err-header {
        padding-left: 18px;
        padding-right: 18px;
      }


      .err-center {

        width: 100%;

        padding: 10px 18px 22px;

        justify-content: center;
      }


      .err-code {

        font-size: clamp(78px, 23vw, 115px);

        letter-spacing: -5px;

        margin-bottom: 15px;
      }


      .err-center h1 {

        max-width: 340px;

        font-size: clamp(25px, 7vw, 34px);

        line-height: 1.12;

        letter-spacing: -0.8px;
      }


      .err-center p {

        max-width: 330px;

        font-size: 11px;

        line-height: 1.55;

        margin-top: 12px;
      }


      .err-actions {

        margin-top: 18px;

        gap: 9px;

        flex-wrap: nowrap;
      }


      .err-actions .btn {

        min-width: 135px;

        justify-content: center;
      }


      /* Hide large decorative elements on mobile */

      .err-shapes svg:nth-child(1) {
        width: 65px !important;
        top: 12% !important;
        left: 2% !important;
      }


      .err-shapes svg:nth-child(2) {
        width: 50px !important;
        top: 17% !important;
        right: 3% !important;
      }


      .err-shapes svg:nth-child(3) {
        width: 45px !important;
        bottom: 12% !important;
        left: 3% !important;
      }


      .err-shapes svg:nth-child(4) {
        width: 65px !important;
        bottom: 12% !important;
        right: 3% !important;
      }


      .err-shapes svg:nth-child(5),
      .err-shapes svg:nth-child(6) {
        display: none;
      }
    }


    /* =====================================================
       SMALL MOBILE
       ===================================================== */

    @media (max-width: 400px) {

      .err-header {
        padding-left: 14px;
        padding-right: 14px;
      }


      .err-center {
        padding-left: 14px;
        padding-right: 14px;
      }


      .err-code {

        font-size: 75px;

        letter-spacing: -4px;

        margin-bottom: 13px;
      }


      .err-center h1 {

        font-size: 24px;

        line-height: 1.1;
      }


      .err-center p {

        max-width: 290px;

        font-size: 10px;

        line-height: 1.5;
      }


      .err-actions {

        gap: 7px;

        margin-top: 16px;
      }


      .err-actions .btn {

        min-width: 125px;

        padding-left: 12px;
        padding-right: 12px;

        font-size: 11px;
      }


      .err-actions .btn-circle {

        width: 27px;
        height: 27px;
      }
    }


    /* =====================================================
       VERY SHORT SCREENS
       ===================================================== */

    @media (max-height: 650px) {

      .err-center {
        padding-top: 5px;
        padding-bottom: 10px;
      }


      .err-code {

        font-size: clamp(65px, 15vh, 110px);

        margin-bottom: 10px;
      }


      .err-center h1 {

        font-size: clamp(23px, 5vh, 34px);
      }


      .err-center p {

        margin-top: 8px;

        font-size: 10px;

        line-height: 1.4;
      }


      .err-actions {

        margin-top: 12px;
      }
    }


    /* =====================================================
       EXTREMELY SHORT MOBILE
       ===================================================== */

    @media (max-height: 560px) {

      .err-code {
        font-size: 65px;

        margin-bottom: 8px;
      }


      .err-center h1 {
        font-size: 22px;
      }


      .err-center p {
        margin-top: 6px;
      }


      .err-actions {
        margin-top: 10px;
      }
    }


    /* =====================================================
       REDUCED MOTION
       ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      .err-shapes *,
      .err-center *,
      .err-code {

        animation: none !important;

        transition: none !important;
      }

    }

  </style>
</head>


<body>

  <!-- =====================================================

  <!-- =====================================================
       GSAP
       ===================================================== -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
  ></script>


  <!-- MAIN JS -->

  <script
    src="assets/js/main.js"
    defer
  ></script>


  <!-- =====================================================
       404 JAVASCRIPT
       ===================================================== -->

  <script>

    /* =========================================
       GO BACK
       ========================================= */

    function goBack() {

      if (window.history.length > 1) {

        window.history.back();

      } else {

        window.location.href = "index.html";

      }

    }


    /* =========================================
       GSAP ANIMATIONS
       ========================================= */

    window.addEventListener(
      "DOMContentLoaded",
      function () {

        if (
          !window.gsap ||
          window.matchMedia(
            "(prefers-reduced-motion: reduce)"
          ).matches
        ) {

          return;

        }


        /* 404 */

        gsap.from(
          ".err-code",
          {
            y: 60,
            opacity: 0,
            duration: 1,
            ease: "power4.out"
          }
        );


        /* TEXT */

        gsap.from(
          ".err-center h1, .err-center p, .err-actions",
          {
            y: 30,
            opacity: 0,
            duration: 0.8,
            stagger: 0.12,
            delay: 0.3,
            ease: "power3.out"
          }
        );


        /* SHAPES */

        gsap.from(
          ".err-shapes svg",
          {
            scale: 0,
            opacity: 0,
            duration: 1,
            stagger: 0.1,
            ease: "back.out(1.6)"
          }
        );


        /* MOUSE MOVEMENT */

        document.addEventListener(
          "mousemove",
          function (e) {

            var x =
              (e.clientX / window.innerWidth - 0.5);

            var y =
              (e.clientY / window.innerHeight - 0.5);


            gsap.to(
              ".err-shapes",
              {
                x: x * 30,
                y: y * 20,
                duration: 0.8,
                overwrite: "auto"
              }
            );

          }
        );

      }
    );

  </script>

</body>
