<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Stackly Volunteer Organization</title>
  <meta name="description" content="The page you're looking for doesn't exist — but there's always another way to make an impact with Stackly.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/svg/stackly-symbol-lime.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <main class="err-page">
    <header class="err-header">
      <a class="brand" href="index.html" aria-label="Stackly - home">
        <span class="brand-mark"><img src="assets/img/impact/logo.webp" alt="Stackly logo"></span>
        <span class="brand-text">
          <span class="brand-name"><img src="assets/img/impact/logo STAC.webp" alt="Stackly"></span>
          <span class="brand-tag">Volunteer Organization</span>
        </span>
      </a>
      <a class="btn btn-lime btn-sm" href="register.html">Become a Volunteer
        <span class="btn-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg></span>
      </a>
    </header>

    <div class="err-shapes" aria-hidden="true">
      <svg style="top:8%;left:6%;width:120px" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="none" stroke="#C9F45A" stroke-opacity="0.35" stroke-width="1.5" class="drift"/></svg>
      <svg style="top:16%;right:10%;width:90px" viewBox="0 0 48 48"><path d="M24 6C24 6 10 18 10 30a14 14 0 0 0 28 0C38 18 24 6 24 6z" fill="none" stroke="#DFFF91" stroke-opacity="0.3" stroke-width="1.5" class="sway"/></svg>
      <svg style="bottom:14%;left:12%;width:70px" viewBox="0 0 48 48"><path d="M10 34C10 20 22 12 38 12c0 16-12 26-26 26" fill="none" stroke="#C9F45A" stroke-opacity="0.3" stroke-width="1.5" class="sway"/></svg>
      <svg style="bottom:20%;right:14%;width:130px" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="none" stroke="#C9F45A" stroke-opacity="0.22" stroke-width="1.5" class="drift"/></svg>
      <svg style="top:46%;left:3%;width:44px" viewBox="0 0 48 48"><circle cx="24" cy="24" r="6" fill="#C9F45A" fill-opacity="0.35" class="drift"/></svg>
      <svg style="top:60%;right:4%;width:54px" viewBox="0 0 48 48"><circle cx="24" cy="24" r="5" fill="#DFFF91" fill-opacity="0.3" class="drift"/></svg>
    </div>

    <div class="err-center">
      <div class="err-code">4<b>0</b>4</div>
      <h1>Looks like you've<br><em>wandered off the path.</em></h1>
      <p>The page you're looking for doesn't exist, but there's always another way to make an impact.</p>
      <div class="err-actions">
        <a class="btn btn-lime" href="index.html" data-cursor="go">Go Home <span class="btn-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg></span></a>
        <button class="btn btn-outline-light" type="button" onclick="window.history.back()">Go Back <span class="btn-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7L7 17"/><path d="M16 17H7V8"/></svg></span></button>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="assets/js/main.js" defer></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      if (!window.gsap || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      gsap.from('.err-code', { y: 60, opacity: 0, duration: 1, ease: 'power4.out' });
      gsap.from('.err-center h1, .err-center p, .err-actions', { y: 30, opacity: 0, duration: 0.8, stagger: 0.12, delay: 0.3, ease: 'power3.out' });
      gsap.from('.err-shapes svg', { scale: 0, opacity: 0, duration: 1, stagger: 0.1, ease: 'back.out(1.6)' });
      document.addEventListener('mousemove', function (e) {
        var x = (e.clientX / window.innerWidth - 0.5);
        var y = (e.clientY / window.innerHeight - 0.5);
        gsap.to('.err-shapes', { x: x * 30, y: y * 20, duration: 0.8, overwrite: 'auto' });
      });
    });
  </script>
</body>
</html>
